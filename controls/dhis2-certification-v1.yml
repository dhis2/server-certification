    criteria:
      - code: TC-01
        name: Tomcat Service Account
        description: >
          Tomcat must run under a dedicated service account with minimal privileges;
          must not run as root.
        verificationMethod: >
          Check Tomcat process ownership; verify service account configuration; confirm
          absence of root privileges.
        verificationCommands: |
          ps -o pid,user,group,args -C java | grep -i catalina || ps aux | grep -E '[c]atalina'
          systemctl show tomcat9 tomcat dhis2 2>/dev/null -p User -p Group -p ExecStart
          id "$(ps -o user= -C java | head -n1)"   # expect a dedicated non-root account
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "10.17"
        score: null
