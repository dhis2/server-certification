      - code: TC-02
        name: Tomcat Shutdown Port Security
        description: >
          Tomcat SHUTDOWN port must be disabled or firewalled; if required, restrict
          to localhost only.
        verificationMethod: >
          Review server.xml for SHUTDOWN port configuration; verify firewall rules;
          test external accessibility.
        verificationCommands: |
          sudo grep -E '<Server .*port=' $CATALINA_BASE/conf/server.xml /etc/tomcat*/server.xml /opt/*/conf/server.xml 2>/dev/null
          sudo ss -tlpn | grep 8005
          # expect port="-1" (disabled), or bound to 127.0.0.1 only and firewalled
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "3.2"
        score: null
        notes: >
