      - code: TC-04
        name: Webapp Modification Prevention
        description: >
          File permissions must prevent Tomcat runtime from modifying deployed application
          artifacts (webapps directory).
        verificationMethod: >
          Audit webapps directory permissions; verify Tomcat user cannot write to
          deployment directories.
        verificationCommands: |
          CB=${CATALINA_BASE:-/var/lib/tomcat9}
          sudo ls -ld "$CB/webapps" "$CB"/webapps/*
          sudo stat -c '%a %U:%G %n' "$CB/webapps" "$CB"/webapps/*.war 2>/dev/null
          ps -o user= -C java | head -n1   # this user should NOT be able to write webapps/
        justification: ''
