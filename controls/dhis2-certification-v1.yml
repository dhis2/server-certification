          necessary ports accessible; check default policies.
        verificationCommands: |
          sudo ufw status verbose
          sudo nft list ruleset 2>/dev/null || { sudo iptables -S; sudo ip6tables -S; }
          sudo ss -tulpn | grep -vE '127.0.0.1|::1'
