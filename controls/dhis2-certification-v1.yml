  - name: DHIS2 Application
    description: DHIS2-specific application security controls including admin access
      and MFA
    weight: 0.15
    criteria:
      - code: AP-01
        name: Default Admin Account Security
        description: >
          DHIS2 default 'admin' account must be disabled/renamed; unique superuser
          credentials with strong authentication required.
        verificationMethod: >
          Verify default admin account status; confirm unique superuser usernames;
          review password complexity requirements.
        verificationCommands: |
          # Adjust -d <dhis2-db>; column names vary slightly by DHIS2 version
          sudo -u postgres psql -d <dhis2-db> -Atc "SELECT username, disabled, lastlogin FROM userinfo WHERE username IN ('admin','system') OR username ILIKE 'admin%';"
          sudo -u postgres psql -d <dhis2-db> -Atc "SELECT ui.username, ur.name FROM userinfo ui JOIN userrolemembers urm ON ui.userinfoid=urm.userid JOIN userrole ur ON ur.userroleid=urm.userroleid WHERE ur.name ILIKE '%superuser%';"
          sudo -u postgres psql -d <dhis2-db> -Atc "SELECT name, value FROM systemsetting WHERE name IN ('keyMinPasswordLength','credentialsExpires');"
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: null
        score: null
        notes: >
          Assessor notes here
      - code: AP-02
        name: Superuser Access Limitation
        description: >
          DHIS2 superusers users must be limited to approximately 1% of total user
          population; quarterly access reviews required.
        verificationMethod: >
          Query superuser role assignments; calculate percentage of superusers.
        verificationCommands: |
          sudo -u postgres psql -d <dhis2-db> -Atc "
          WITH su AS (SELECT DISTINCT urm.userid FROM userroleauthorities ura
            JOIN userrolemembers urm ON urm.userroleid=ura.userroleid WHERE ura.authorities='ALL')
          SELECT (SELECT count(*) FROM su) AS superusers,
                 (SELECT count(*) FROM userinfo) AS total_users,
                 round(100.0*(SELECT count(*) FROM su)/NULLIF((SELECT count(*) FROM userinfo),0),2) AS pct;"
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: null
        score: null
        notes: >
          Assessor notes here
      - code: AP-03
        name: Multi-Factor Authentication (Superuser accounts)
        description: >
          MFA must be enforced for all DHIS2 superuser accounts; hardware or app-based
          tokens preferred.
        verificationMethod: >
          Verify MFA configuration for admin accounts; review MFA enrollment status;
          test MFA enforcement at login.
        verificationCommands: |
          # 2FA column differs by version: userinfo.secret (older) / twofa_secret / uses_two_factor
          sudo -u postgres psql -d <dhis2-db> -Atc "SELECT column_name FROM information_schema.columns WHERE table_name='userinfo' AND column_name ~* 'twofa|secret|two_factor';"
          sudo -u postgres psql -d <dhis2-db> -Atc "
          SELECT ui.username, (ui.secret IS NOT NULL) AS twofa_enabled
          FROM userinfo ui JOIN userrolemembers urm ON ui.userinfoid=urm.userid
          JOIN userroleauthorities ura ON ura.userroleid=urm.userroleid WHERE ura.authorities='ALL';"
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: null
        score: null
        notes: >
          Assessor notes here
  - name: DHIS2 Tomcat Application Server
