      - code: TC-03
        name: Application Auto-Deployment Disabled
        description: Tomcat auto-deployment must be disabled.
        verificationMethod: Review server.xml and Host configuration for autoDeploy
          setting.
        verificationCommands: |
          sudo grep -E 'autoDeploy|deployOnStartup|unpackWARs' $CATALINA_BASE/conf/server.xml /etc/tomcat*/server.xml 2>/dev/null
          # expect autoDeploy="false" and deployOnStartup="false"
