templateName: DHIS2 Server Certification Program (DSCP)
templateDescription: >
  Assessment Checklist for assessing DHIS2 server implementations against
  security, performance and deployment best practices. This checklist can be used
  by DHIS2 implementers and hosting providers to validate their DHIS2 server setups
  for compliance.
version: 1
categories:
  - name: PostgreSQL Database
    description: Database security, backup, and configuration controls for PostgreSQL
    weight: 0.15
    criteria:
      - code: DB-01
        name: Regular Automated Database Backup
        description: >
          Automated daily backups must be configured with defined retention policies
          and integrity verification mechanisms.
        verificationMethod: >
          Review backup configuration files; verify backup logs from past 30 days;
          confirm retention policy documentation; test backup integrity checksums.
        verificationCommands: |
          # Scheduled backup jobs (cron + systemd timers)
          sudo crontab -l; ls -l /etc/cron.d/ /etc/cron.daily/
          systemctl list-timers --all | grep -Ei 'backup|dump|pgbackrest|barman'
          # Backup tool config and catalogue
          sudo -u postgres pgbackrest info 2>/dev/null || true
          sudo ls -lh /var/backups/postgresql/ /var/lib/pgbackrest/ /var/lib/barman/ 2>/dev/null
          # Last 30 days of backup activity
          sudo journalctl -u '*backup*' --since '30 days ago' --no-pager | tail -n 50
          sudo ls -l /var/log/pgbackrest/ /var/log/barman/ 2>/dev/null
        justification: >
          Having database backups is a critical safety net when running a DHIS2 instance.
          Manual backups are not sufficient to guarantee that the right backup will be 
          available when you need it.  They should be automated to conform to an agreed
          backup plan.
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "11.2"
        score: null
        notes: >
          Assessor notes here
      - code: DB-02
        name: Database Backup Restore Testing
        description: >
          Periodic restore tests must be performed to a non-production environment
          to validate backup integrity and recovery procedures.
        verificationMethod: >
          Review restore test documentation or logs from past 3 months; verify test
          results and lessons learned; confirm non-production test environment exists.
        verificationCommands: |
          # Evidence of restore / verify runs
          sudo -u postgres pgbackrest --stanza=<stanza> check 2>/dev/null || true
          sudo grep -rniE 'restore|verify' /var/log/pgbackrest/ /var/log/barman/ 2>/dev/null | tail -n 20
          # Non-production restore target on this host, if any
          sudo -u postgres psql -l | grep -Ei 'test|restore|staging'
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "11.5"
        score: null
        notes: >
          Assessor notes here
      - code: DB-03
        name: Off-Site Backup Storage
        description: >
          Backup copies must be stored off-site or in a separate region/account to
          protect against site-wide disasters.
        verificationMethod: Verify off-site backup location and access controls.
        verificationCommands: |
          # Off-site sync jobs / tooling
          sudo grep -rniE 'rclone|aws s3|gsutil|azcopy|rsync .*@' /etc/cron* /etc/systemd/system 2>/dev/null
          rclone listremotes 2>/dev/null; aws configure list 2>/dev/null
          # Most recent object pushed off-site (rclone example)
          rclone lsl <remote>:<bucket>/ 2>/dev/null | tail -n 5
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "11.4"
        score: null
        notes: >
          Assessor notes here
      - code: DB-04
        name: Database Least Privilege Access
        description: >
          Database users must be assigned minimum necessary privileges; administrative
          and service accounts must be separated; regular access reviews required.
        verificationMethod: >
          Review database user roles and permissions; verify the DHIS2 user only has
          access to the required DHIS2 database, and from the DHIS2 IP address.
        verificationCommands: |
          sudo -u postgres psql -c '\du+'
          sudo -u postgres psql -c '\l'
          sudo -u postgres psql -Atc "SELECT grantee, table_catalog, privilege_type FROM information_schema.role_table_grants WHERE grantee NOT IN ('postgres') LIMIT 50;"
          # The DHIS2 role must not be a superuser
          sudo -u postgres psql -Atc "SELECT rolname, rolsuper, rolcreatedb, rolcreaterole FROM pg_roles WHERE rolname='<dhis2-db-user>';"
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "5.4"
        score: null
        notes: >
          Assessor notes here
      - code: DB-05
        name: Database Backup File Permissions
        description: >
          Backup artifacts must inherit restrictive permissions (Unix mode 660) and
          must not be world-readable.
        verificationMethod: >
          Audit backup file permissions; verify backup scripts include proper permission
          settings; check for world-readable backup files.
        verificationCommands: |
          sudo find /var/backups/postgresql /var/lib/pgbackrest /var/lib/barman -type f \( -name '*.backup' -o -name '*.gz' -o -name '*.zst' -o -name '*.sql*' \) -printf '%m %u:%g %p\n' 2>/dev/null
          # Flag anything group/other readable (expect 0640/0660)
          sudo find /var/backups/postgresql -type f -perm /0007 -printf 'WORLD-READABLE: %p\n' 2>/dev/null
          sudo stat -c '%a %U:%G %n' /var/backups/postgresql 2>/dev/null
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: null
        score: null
        notes: >
          Assessor notes here
      - code: DB-06
        name: Database Encryption at Rest
        description: >
          Full-disk encryption is enabled with secure key management practices separate
          from data storage.
        verificationMethod: >
          Verify encryption configuration; review key management procedures; confirm
          encryption status of all database volumes.
        verificationCommands: |
          lsblk -o NAME,FSTYPE,MOUNTPOINT,TYPE
          sudo dmsetup ls --target crypt
          for d in $(sudo dmsetup ls --target crypt 2>/dev/null | awk '{print $1}'); do sudo cryptsetup status "$d"; done
          DD=$(sudo -u postgres psql -Atc 'SHOW data_directory;'); findmnt -no SOURCE,FSTYPE "$DD"
          # Cloud volumes: confirm encryption flag in the provider console
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "3.11"
        score: null
        notes: >
          Assessor notes here
      - code: DB-07
        name: Backup Encryption at Rest
        description: >
          Backups must be encrypted at rest with encryption keys managed separately
          from the backup storage location.
        verificationMethod: >
          Verify backup encryption configuration; confirm key storage separation;
          test encrypted backup restore procedure.
        verificationCommands: |
          # pgBackRest cipher settings
          sudo grep -Ei 'cipher-type|cipher-pass|repo.*-cipher' /etc/pgbackrest/pgbackrest.conf /etc/pgbackrest.conf 2>/dev/null
          # Inspect an actual backup artifact
          sudo find /var/backups/postgresql /var/lib/pgbackrest -type f | head -n1 | xargs -r sudo file
          sudo grep -rniE 'gpg|openssl enc|age -e' /etc/cron* /etc/systemd/system 2>/dev/null
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "3.11"
        score: null
        notes: >
          Assessor notes here
      - code: DB-08
        name: PostgreSQL Host-Based Access Control
        description: >
          pg_hba.conf must restrict host-based access, enforce TLS connections, and
          use SCRAM-SHA-256 authentication over MD5.
        verificationMethod: >
          Review pg_hba.conf file; ensure the DHIS2 instance user only has access
          to the DHIS2 database, and from the DHIS2 IP address. Verify TLS enforcement;
          confirm SCRAM authentication enabled; check for MD5 usage.
        verificationCommands: |
          HBA=$(sudo -u postgres psql -Atc 'SHOW hba_file;'); echo "$HBA"
          sudo grep -vE '^\s*#|^\s*$' "$HBA"
          sudo -u postgres psql -Atc 'SHOW ssl;'
          sudo -u postgres psql -Atc 'SHOW password_encryption;'   # expect scram-sha-256
          sudo grep -vE '^\s*#|^\s*$' "$HBA" | grep -i md5   # expect no rows
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "5.1"
        score: null
        notes: >
          Assessor notes here
      - code: DB-09
        name: Supported PostgreSQL Version (Non-EOL)
        description: >
          PostgreSQL must be a supported version that is not past end-of-life as per
          the official PostgreSQL support schedule at the time of assessment.
        verificationMethod: >
          Run SELECT version(); and capture output; compare against the PostgreSQL
          version support/EOL matrix; review OS package source and pinned version.
        verificationCommands: |
          sudo -u postgres psql -c 'SELECT version();'
          pg_lsclusters
          apt policy 'postgresql-1*' 2>/dev/null | grep -A1 -Ei 'postgresql-[0-9]'
          # Compare against https://www.postgresql.org/support/versioning/
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: null
        score: null
        notes: >
          Assessor notes here
      - code: DB-10
        name: PostgreSQL Tuning Baseline
        description: >
          PostgreSQL configuration must be optimized with the following set max_connections,
          shared_buffers, work_mem, maintenance_work_mem, effective_cache_size, max_locks_per_transaction
          set to reasonable values based on the server capacity.
        verificationMethod: >
          Run SHOW jit; (expect off) and verify corresponding entries in postgresql.conf
          and effective reload/restart logs.
        verificationCommands: |
          sudo -u postgres psql -Atc "SELECT name, setting, unit FROM pg_settings WHERE name IN ('max_connections','shared_buffers','work_mem','maintenance_work_mem','effective_cache_size','max_locks_per_transaction','jit');"
          sudo -u postgres psql -c 'SHOW jit;'   # expect off
          sudo grep -EnR 'max_connections|shared_buffers|work_mem|maintenance_work_mem|effective_cache_size|max_locks_per_transaction|jit' /etc/postgresql/*/main/ 2>/dev/null
          free -h; nproc
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: null
        score: null
        notes: >
          Assessor notes here
  - name: Reverse Proxy
    description: Reverse Proxy configuration
    weight: 0.1
    criteria:
      - code: DP-01
        name: Reverse Proxy Deployment
        description: >
          A reverse proxy (e.g., Nginx, Apache, HAProxy) must be deployed in front
          of the DHIS2 application server (tomcat) to handle incoming traffic.
        verificationMethod: >
          Review network architecture documentation (if any); verify reverse proxy
          installation and configuration; confirm traffic routing through proxy.
        verificationCommands: |
          nginx -v 2>&1 || apache2 -v 2>&1 || haproxy -v 2>&1
          systemctl status nginx apache2 haproxy 2>/dev/null | grep -E 'Loaded|Active'
          sudo ss -tulpn | grep -E ':80|:443'
          sudo nginx -T 2>/dev/null | grep -E 'proxy_pass|upstream|server_name|listen'
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: null
        score: null
        notes: >
          Assessor notes here
      - code: DP-02
        name: TLS/SSL Configuration
        description: >
          TLS 1.2 or higher with modern cipher suites must be enforced; HSTS enabled;
          SSL Labs rating of A or A+ required.
        verificationMethod: >
          Run SSL Labs scan; verify TLS version and cipher configuration; review certificate
          validity.
        verificationCommands: |
          # From the assessor host:
          nmap --script ssl-enum-ciphers -p 443 <domain>
          echo | openssl s_client -connect <domain>:443 -servername <domain> 2>/dev/null | openssl x509 -noout -dates -issuer -subject
          curl -sI https://<domain> | grep -i strict-transport-security
          sudo nginx -T 2>/dev/null | grep -Ei 'ssl_protocols|ssl_ciphers|ssl_prefer_server_ciphers'
          # Full grade: run SSL Labs (https://www.ssllabs.com/ssltest/) or testssl.sh
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "3.1"
        score: null
        notes: >
          Assessor notes here
      - code: DP-03
        name: Reverse Proxy Access Control
        description: >
          Reverse proxy must restrict access to only required DHIS2 services and endpoints;
          default-deny policy enforced.
        verificationMethod: >
          Review reverse proxy configuration; perform external port scan; verify only
          necessary endpoints accessible; check default-deny rules.
        verificationCommands: |
          sudo nginx -T 2>/dev/null | grep -Ei 'location|allow |deny |limit_except|auth_basic|internal;|return 40'
          # External surface from the assessor host:
          nmap -Pn -p- <server-ip>
          curl -sk -o /dev/null -w '%{http_code}\n' https://<domain>/api/
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "4.4"
        score: null
        notes: >
          Assessor notes here
      - code: DP-04
        name: Reverse Proxy Access Logging
        description: >
          Comprehensive access logging must be enabled on the reverse proxy with log
          retention and integrity protection.
        verificationMethod: >
          Review logging configuration; verify log retention policy; check log integrity
          mechanisms; confirm log review procedures.
        verificationCommands: |
          sudo nginx -T 2>/dev/null | grep -Ei 'access_log|error_log|log_format'
          sudo ls -l /var/log/nginx/
          cat /etc/logrotate.d/nginx
          sudo tail -n 5 /var/log/nginx/access.log
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "8.1"
        score: null
        notes: >
          Assessor notes here
      - code: DP-05
        name: Reverse Proxy Least Privilege
        description: >
          Reverse proxy service must run under a dedicated non-root user with minimal
          privileges.
        verificationMethod: >
          Check reverse proxy process ownership; verify service account configuration;
          confirm absence of root privileges.
        verificationCommands: |
          ps -o pid,user,group,args -C nginx 2>/dev/null || ps aux | grep -E '[n]ginx'
          grep -E '^\s*user\s' /etc/nginx/nginx.conf
          id www-data
          systemctl show nginx -p User -p Group -p PrivateTmp -p ProtectSystem 2>/dev/null
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "5.4"
        score: null
        notes: >
          Assessor notes here
      - code: DP-06
        name: Reverse Proxy Security Updates
        description: >
          Reverse proxy software must be kept up-to-date with security patches; version
          must not be end-of-life.
        verificationMethod: >
          Check reverse proxy version; compare against vendor EOL schedule.
        verificationCommands: |
          nginx -v 2>&1
          apt policy nginx 2>/dev/null
          apt list --upgradable 2>/dev/null | grep -i nginx
          # Check version against vendor EOL (nginx.org) / distro support window
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: null
        score: null
        notes: >
          Assessor notes here
      - code: DP-07
        name: Reverse Proxy Security Headers
        description: >
          Security headers such as X-Frame-Options, X-Content-Type-Options, HSTS and
          Referrer-Policy must be configured (if not set on the DHIS2 backend).
        verificationMethod: >
          Review reverse proxy configuration for security headers; test header presence
          using browser developer tools; verify correct values.
        verificationCommands: |
          curl -sI https://<domain> | grep -iE 'strict-transport-security|x-frame-options|x-content-type-options|referrer-policy|content-security-policy'
          sudo nginx -T 2>/dev/null | grep -i 'add_header'
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: null
        score: null
        notes: >
          Assessor notes here
  - name: Operating System Security
    description: Linux server hardening, SSH configuration, patching, and monitoring
    weight: 0.2
    criteria:
      - code: OS-01
        name: Disable Direct Root SSH Access
        description: >
          Direct root login via SSH must be disabled; sudo with individual named accounts
          required for administrative access.
        verificationMethod: >
          Review sshd_config for PermitRootLogin setting; verify sudo configuration;
          check for individual admin accounts.
        verificationCommands: |
          sudo sshd -T | grep -i '^permitrootlogin'   # expect: no
          sudo grep -riE '^\s*PermitRootLogin' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/ 2>/dev/null
          sudo grep -rvE '^\s*#|^\s*$' /etc/sudoers /etc/sudoers.d/ 2>/dev/null
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "5.4"
        score: null
        notes: >
          Assessor notes here
      - code: OS-02
        name: SSH Key-Based Authentication
        description: >
          SSH key-based authentication must be enforced; keys must be rotated regularly;
          weak algorithms disabled.
        verificationMethod: >
          Verify SSH key configuration; check for password authentication disabled;
          review authorized_keys; confirm algorithm restrictions.
        verificationCommands: |
          sudo sshd -T | grep -iE '^(pubkeyauthentication|authorizedkeysfile|hostbasedauthentication)'
          sudo sshd -T | grep -iE '^(kexalgorithms|ciphers|macs|hostkeyalgorithms|pubkeyacceptedalgorithms)'
          sudo find /home /root -name authorized_keys -exec ls -l {} \; -exec cat {} \;
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "5.2.17"
        score: null
        notes: >
          Assessor notes here
      - code: OS-03
        name: SSH Password Authentication Disabled
        description: >
          SSH password authentication must be disabled (PasswordAuthentication no);
          strong key exchange and MAC algorithms enforced.
        verificationMethod: >
          Review sshd_config for PasswordAuthentication, KexAlgorithms, and MACs settings;
          test password login attempt (should fail).
        verificationCommands: |
          sudo sshd -T | grep -iE '^(passwordauthentication|kbdinteractiveauthentication|challengeresponseauthentication|permitemptypasswords)'
          sudo sshd -T | grep -iE '^(kexalgorithms|macs)'
          # Negative test from the assessor host (must be rejected):
          ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no <user>@<server-ip>
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "5.2.8"
        score: null
        notes: >
          Assessor notes here
      - code: OS-04
        name: SSH Configuration File Permissions
        description: >
          SSH configuration and key files must have restrictive permissions (600/640/660)
          with proper ownership.
        verificationMethod: >
          Audit permissions on /etc/ssh/sshd_config, private keys, authorized_keys;
          verify ownership; check umask.
        verificationCommands: |
          sudo stat -c '%a %U:%G %n' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/* /etc/ssh/ssh_host_*_key /etc/ssh/ssh_host_*_key.pub 2>/dev/null
          sudo find /home /root -name 'id_*' ! -name '*.pub' -exec stat -c '%a %U:%G %n' {} \;
          grep -E '^UMASK' /etc/login.defs
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "5.3.1, 5.3.2, 5.3.3"
        score: null
        notes: >
          Assessor notes here
      - code: OS-05
        name: Multiple Administrative Accounts
        description: >
          Multiple break-glass admin accounts required (2-3 not more than 4); usage
          must be monitored and logged.
        verificationMethod: >
          Verify number of admin accounts; review admin account usage logs; confirm
          monitoring and alerting on admin activity.
        verificationCommands: |
          getent group sudo admin adm | awk -F: '{print $1": "$4}'
          sudo awk -F: '($3>=1000 && $3<65534){print $1}' /etc/passwd
          sudo grep -rE '^[^#].*ALL=\(ALL' /etc/sudoers /etc/sudoers.d/ 2>/dev/null
          grep -E 'sudo:|COMMAND=' /var/log/auth.log 2>/dev/null | tail -n 20
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "5.4"
        score: null
        notes: >
          Assessor notes here
      - code: OS-06
        name: Individual SSH Account Accountability
        description: >
          Each SSH user must have a unique, named account; shared credentials prohibited;
          MFA enforced where possible.
        verificationMethod: >
          Review /etc/passwd for user accounts; verify no shared accounts exist; check
          SSH authentication methods and MFA status.
        verificationCommands: |
          getent passwd | awk -F: '$3>=1000 && $3<65534'
          sudo lastlog | grep -vE 'Never logged in'
          sudo sshd -T | grep -iE '^(authenticationmethods|permitrootlogin)'
          getent passwd | grep -iE 'admin|deploy|ops|shared|dhis'   # look for generic/shared names
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "5.2"
        score: null
        notes: >
          Assessor notes here
      - code: OS-07
        name: OS User Offboarding Procedure
        description: >
          System access revocation upon termination; prompt removal from sudoers and
          privileged groups.
        verificationMethod: >
          Review OS offboarding procedures; verify timeline compliance; check removal
          from groups/sudoers.
        verificationCommands: ""
        justification: ''
        controlGroup: DSCP1
        controlType: organizational
        cisMapping: "5.3"
        score: null
        notes: >
          Assessor notes here
      - code: OS-08
        name: User Home Directory Hygiene
        description: >
          User home directories must not contain sensitive data or unprotected keys;
          proper permissions enforced.
        verificationMethod: >
          Audit home directories for sensitive files; check for SSH keys, credentials,
          configs; verify directory permissions.
        verificationCommands: |
          sudo find /home /root -maxdepth 3 -type f \( -name 'id_rsa' -o -name 'id_ed25519' -o -name '*.pem' -o -name '*.key' -o -name '.pgpass' -o -name '.my.cnf' -o -name '*.env' \) -exec ls -l {} \;
          sudo find /home -maxdepth 1 -mindepth 1 -type d -exec stat -c '%a %U:%G %n' {} \;
          sudo grep -rlE 'PASSWORD|SECRET|TOKEN|API_KEY' /home/*/ 2>/dev/null | head
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "6.1"
        score: null
        notes: >
          Assessor notes here
      - code: OS-09
        name: Automated Security Patching
        description: >
          Unattended security updates must be enabled; patch status monitoring required.
        verificationMethod: >
          Verify unattended-upgrades or equivalent service; review patch logs; confirm
          reboot policy.
        verificationCommands: |
          systemctl status unattended-upgrades 2>/dev/null | grep -E 'Loaded|Active'
          cat /etc/apt/apt.conf.d/20auto-upgrades
          apt-config dump | grep -Ei 'Unattended-Upgrade::(Allowed-Origins|Automatic-Reboot|Origins-Pattern)'
          sudo tail -n 20 /var/log/unattended-upgrades/unattended-upgrades.log 2>/dev/null
          apt list --upgradable 2>/dev/null
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "7.3"
        score: null
        notes: >
          Assessor notes here
      - code: OS-10
        name: User Home Directory Hygiene
        description: >
          User home directories must not contain sensitive data or unprotected keys;
          proper permissions enforced.
        verificationMethod: >
          Audit home directories for sensitive files; check for SSH keys, credentials,
          configs; verify directory permissions.
        verificationCommands: |
          # NOTE: OS-10 duplicates OS-08 in this control set; use the same checks.
          sudo find /home /root -maxdepth 3 -type f \( -name 'id_rsa' -o -name 'id_ed25519' -o -name '*.pem' -o -name '*.key' -o -name '.pgpass' -o -name '*.env' \) -exec ls -l {} \;
          sudo find /home -maxdepth 1 -mindepth 1 -type d -exec stat -c '%a %U:%G %n' {} \;
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "6.1"
        score: null
        notes: >
          Assessor notes here
      - code: OS-11
        name: System Monitoring and Alerting
        description: >
          Host and service monitoring must be implemented for CPU, memory, disk, web
          proxy, and database with alerting thresholds.
        verificationMethod: >
          Review monitoring platform configuration; verify alert rules and thresholds;
          confirm notification channels; test alert delivery.
        verificationCommands: |
          systemctl list-units --type=service --state=running | grep -Ei 'prometheus|node_exporter|grafana|zabbix|netdata|telegraf|collectd|nagios|datadog|newrelic'
          sudo ss -tulpn | grep -E ':9100|:9090|:3000|:19999'
          sudo find /etc -iname '*alert*' -o -iname '*.rules' 2>/dev/null | grep -Ei 'prometheus|alertmanager'
          # Confirm alert destinations (email/Slack/PagerDuty) and trigger a test alert
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: null
        score: null
        notes: >
          Assessor notes here
      - code: OS-12
        name: Operating System Encryption at Rest
        description: >
          Full-disk encryption is enabled on servers and volumes (LUKS/FileVault/BitLocker
          or equivalent).
        verificationMethod: >
          Verify encryption status of system volumes; review key management procedures;
          confirm encryption is active at boot.
        verificationCommands: |
          lsblk -o NAME,FSTYPE,MOUNTPOINT,TYPE
          sudo dmsetup ls --target crypt
          for d in $(sudo dmsetup ls --target crypt 2>/dev/null | awk '{print $1}'); do sudo cryptsetup status "$d"; done
          sudo blkid | grep -i crypto_LUKS
          # Cloud: confirm root/data volume encryption in the provider console
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "3.11"
        score: null
        notes: >
          Assessor notes here
      - code: OS-13
        name: Operating System Least Privilege
        description: >
          OS users must be assigned minimum necessary privileges with role separation;
          periodic access reviews required.
        verificationMethod: >
          Review user accounts and group memberships; verify sudo configurations.
        verificationCommands: |
          getent group | grep -E 'sudo|adm|docker|wheel|lxd'
          for u in $(awk -F: '$3>=1000 && $3<65534{print $1}' /etc/passwd); do echo "== $u =="; sudo -lU "$u" 2>/dev/null | grep -E 'may run|NOPASSWD|ALL'; done
          sudo grep -rvE '^\s*#|^\s*$' /etc/sudoers /etc/sudoers.d/ 2>/dev/null
        justification: ''
        controlGroup: DSCP1
        controlType: technical
        cisMapping: "5.4"
